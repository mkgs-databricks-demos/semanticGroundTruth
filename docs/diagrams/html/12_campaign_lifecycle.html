<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1B1F2B;
            color: #FFFFFF;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #FF3621;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #B0B5C3;
            font-size: 0.85rem;
            margin-bottom: 32px;
        }
        .mermaid {
            background: #252836;
            border: 1px solid #3E4252;
            border-radius: 12px;
            padding: 32px;
            max-width: 95vw;
            overflow-x: auto;
        }
        .source-file {
            color: #8B90A7;
            font-size: 0.75rem;
            margin-top: 24px;
            font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }
    </style>
</head>
<body>
    <h1>12 — Campaign Lifecycle (Campaign Manager)</h1>
    <div class="subtitle">Semantic Ground Truth App — L200 Diagram</div>
    <div class="mermaid" id="diagram"></div>
    <div class="source-file">Source: docs/diagrams/mermaid/12_campaign_lifecycle.md</div>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            themeVariables: {
                primaryColor: '#FF3621',
                primaryTextColor: '#FFFFFF',
                primaryBorderColor: '#FF3621',
                lineColor: '#B0B5C3',
                secondaryColor: '#252836',
                tertiaryColor: '#1B1F2B',
                background: '#252836',
                mainBkg: '#252836',
                nodeBorder: '#FF3621',
                clusterBkg: '#2A2D3A',
                clusterBorder: '#3E4252',
                titleColor: '#FF3621',
                edgeLabelBackground: '#252836'
            }
        });
        const source = `
stateDiagram-v2
    [*] --> Created: Data Steward creates<br/>or auto-triggered

    Created --> Active: Activate campaign

    Active --> Completed: All assets meet<br/>completion criteria
    Active --> Paused: Data Steward pauses
    Active --> Active: New assets added<br/>or freshness triggers

    Paused --> Active: Data Steward resumes
    Paused --> Archived: Data Steward archives

    Completed --> Archived: Auto-archive<br/>after retention period
    Completed --> Active: Freshness interval<br/>triggers re-validation

    Archived --> [*]

    note right of Created
        Campaign types:
        - Automatic (version change)
        - Manual (Data Steward)
        - Freshness (interval expiry)
    end note

    note right of Active
        Completion criteria (configurable):
        Default: all assets reviewed once
        Strict: all assets certified
    end note
        `;
        const { svg } = await mermaid.render('mermaid-svg', source);
        document.getElementById('diagram').innerHTML = svg;
    </script>
</body>
</html>
