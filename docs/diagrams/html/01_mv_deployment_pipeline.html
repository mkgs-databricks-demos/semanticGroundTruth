<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1B1F2B;
            color: #FFFFFF;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #FF3621;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #B0B5C3;
            font-size: 0.85rem;
            margin-bottom: 32px;
        }
        .mermaid {
            background: #252836;
            border: 1px solid #3E4252;
            border-radius: 12px;
            padding: 32px;
            max-width: 95vw;
            overflow-x: auto;
        }
        .source-file {
            color: #8B90A7;
            font-size: 0.75rem;
            margin-top: 24px;
            font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }
    </style>
</head>
<body>
    <h1>01 — Metric View Deployment Pipeline</h1>
    <div class="subtitle">Semantic Ground Truth App — L100 Diagram</div>
    <div class="mermaid" id="diagram"></div>
    <div class="source-file">Source: docs/diagrams/mermaid/01_mv_deployment_pipeline.md</div>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            themeVariables: {
                primaryColor: '#FF3621',
                primaryTextColor: '#FFFFFF',
                primaryBorderColor: '#FF3621',
                lineColor: '#B0B5C3',
                secondaryColor: '#252836',
                tertiaryColor: '#1B1F2B',
                background: '#252836',
                mainBkg: '#252836',
                nodeBorder: '#FF3621',
                clusterBkg: '#2A2D3A',
                clusterBorder: '#3E4252',
                titleColor: '#FF3621',
                edgeLabelBackground: '#252836'
            }
        });
        const source = `
sequenceDiagram
    participant Repo as DAB Repo<br/>(fixtures/)
    participant Job as Lakeflow Job<br/>(forEach Task)
    participant NB as Notebook Task
    participant UC as Unity Catalog<br/>(Target Env)

    Repo->>Job: Trigger on deploy<br/>(list YAML files in fixtures/)
    loop For each YAML file
        Job->>NB: Pass fixture path +<br/>target catalog, schema,<br/>source table overrides
        NB->>NB: Parse YAML fixture
        NB->>NB: Resolve environment-specific<br/>source table references
        NB->>NB: Generate CREATE OR REPLACE VIEW<br/>... WITH METRICS LANGUAGE YAML
        NB->>UC: Execute SQL via<br/>Statement Execution API
        UC-->>NB: View created/updated
        NB-->>Job: Success + view name
    end
    Job-->>Repo: All views deployed
        `;
        const { svg } = await mermaid.render('mermaid-svg', source);
        document.getElementById('diagram').innerHTML = svg;
    </script>
</body>
</html>
