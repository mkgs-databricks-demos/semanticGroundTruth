                edgeLabelBackground: '#252836'
            }
        });
        const source = `
flowchart TB
    subgraph Triggers["Event Triggers"]
        FBReady[Feature Branch Ready]
        PipeFail[Pipeline Failure]

    Medium --> InApp
    Low --> Digest

    High --> DS
    Critical --> DS & Admin
    Medium --> DS
    Low --> Reviewers
    GameMile --> Individual
        `;
        const { svg } = await mermaid.render('mermaid-svg', source);
        document.getElementById('diagram').innerHTML = svg;
