<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1480" viewBox="0 0 800 1480">
  <metadata>
    <title>10 — Lakebase ER Diagram (Asset Registry)</title>
    <description>Mermaid source diagram — render with mermaid-cli or open the HTML version in a browser.
Source: docs/diagrams/mermaid/10_lakebase_er_diagram.md</description>
    <mermaid-source>erDiagram
    assets ||--o{ asset_versions : &quot;has versions&quot;
    assets ||--o{ asset_synonyms : &quot;has synonyms&quot;
    assets ||--o{ votes : &quot;receives votes&quot;
    assets ||--o{ example_questions : &quot;has examples&quot;
    assets ||--|| confidence_scores : &quot;has score&quot;
    
    asset_synonyms ||--o{ synonym_votes : &quot;receives votes&quot;
    
    votes }o--o| feedback_batches : &quot;processed in&quot;
    
    campaigns ||--o{ campaign_assignments : &quot;has assignments&quot;
    
    assets {
        uuid asset_id PK
        text asset_type
        text name
        text description
        text yaml_content
        text repo_url
        text fixture_path
        text environment
        int version
        text version_hash
        bool is_active
        float confidence_score
        int total_votes
    }
    
    votes {
        uuid vote_id PK
        uuid asset_id FK
        int asset_version
        text user_id
        text vote_type
        text feedback
        jsonb edits_json
        bool processed
        uuid feedback_batch_id FK
    }
    
    confidence_scores {
        uuid asset_id PK
        float wilson_score
        int total_votes
        int total_approvals
        float industry_prior
        float prior_weight
    }
    
    campaigns {
        uuid campaign_id PK
        text name
        text campaign_type
        text status
        text scope_domain
        int freshness_interval_days
    }
    
    feedback_batches {
        uuid batch_id PK
        text status
        int vote_count
        text feature_branch_url
    }
    
    notifications {
        uuid notification_id PK
        text event_type
        text recipient_id
        text channel
        text status
    }
    
    user_activity {
        uuid user_id PK
        int total_reviews
        int streak_days
        int edits_accepted
    }</mermaid-source>
  </metadata>
