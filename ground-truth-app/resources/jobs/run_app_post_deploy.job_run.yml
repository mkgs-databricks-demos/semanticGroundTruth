# resources/jobs/run_app_post_deploy.job_run.yml
# Deploy hook: auto-triggers app_post_deploy_setup on every `bundle deploy`.
# Ensures M2M SPN can authenticate through the app's auth sidecar.
# Requires: engine: direct, CLI >= 1.7.0

resources:
  job_runs:
    run_app_post_deploy:
      job_id: ${resources.jobs.app_post_deploy_setup.id}
      job_parameters:
        app_name: ${var.app_display_name}
        scope_name: semantic_ground_truth_credentials
        client_id_key: m2m_client_id_${bundle.target}
