# resources/jobs/run_app_post_deploy.job_run.yml
# Deploy hook: auto-triggers app_post_deploy_setup on every `bundle deploy`.
# Ensures M2M SPN has App CAN_USE + UC grants (USE CATALOG/SCHEMA, EXECUTE,
# READ/WRITE VOLUME on ui_visual_checks; the volume comes from ground-truth-infra, deployed first).
# Requires: engine: direct, CLI >= 1.7.0

resources:
  job_runs:
    run_app_post_deploy:
      job_id: ${resources.jobs.app_post_deploy_setup.id}
      job_parameters:
        app_name: ${var.app_display_name}
        scope_name: semantic_ground_truth_credentials
        client_id_key: m2m_client_id_${bundle.target}
        catalog: ${var.catalog}
        schema_name: ${var.catalog}.${var.schema_name}
        mcp_service_name: ${var.catalog}.${var.schema_name}.semantic-ground-truth-mcp
        visual_checks_volume: ${var.catalog}.${var.schema_name}.ui_visual_checks
