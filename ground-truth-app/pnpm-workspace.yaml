packages:
  - '.'

overrides:
  vite: npm:rolldown-vite@7.1.14
  '@opentelemetry/core': 2.8.0
  systeminformation: 5.33.18
  fast-uri: 3.1.9
  socks: 2.8.7
  bare-path: 3.1.1
  bare-url: 2.5.2
  # Security overrides (2026-10-29, docs/sessions/2026-10-29_dependabot-triage.md).
  # dompurify, echarts, js-yaml: exact pins in AppKit / AppKit UI 0.89.0; yaml, qs: locked
  # through AppKit, OTel and Express. Drop each once upstream ships the patched version.
  dompurify: 3.4.17
  echarts: 6.1.0
  'js-yaml@4.3.1': 4.3.2
  yaml: 2.8.3
  qs: 6.16.1

allowBuilds:
  '@ast-grep/napi': true
  esbuild: true
  '@databricks/appkit': true
  '@databricks/appkit-ui': true
  protobufjs: true
