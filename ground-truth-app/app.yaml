# app.yaml: intentionally empty. Do not add `command` or `env` here.
#
# The app's runtime command and env live ONLY in resources/app.app.yml under
# `resources.apps.app.config`. When that bundle `config` block is set it REPLACES
# this file's command + env, so anything here would be silently ignored.
# (2026-10-28: a duplicate env list here hid missing valueFrom bindings until a
# clean deploy failed with "Warehouse ID not found".)
#
# Deploy with deploy.sh / `databricks bundle deploy`, not a plain
# `databricks apps deploy`, which would start the app with no env at all.
