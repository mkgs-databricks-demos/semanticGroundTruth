command: ['pnpm', 'run', 'start']
env:
  # ── App resource bindings (injected by platform from databricks.yml resources) ──
  - name: DATABRICKS_SERVING_ENDPOINT_NAME
    valueFrom: agents-serving-endpoint
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: agents-mlflow-experiment
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DATABRICKS_JOB_ID
    valueFrom: job
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres

  # ── RBAC bootstrap ──
  - name: GT_BOOTSTRAP_ADMIN_IDS
    valueFrom: m2m-client-id
  - name: GT_ADMIN_EMAILS
    value: matthew.giglia@databricks.com

  # ── OpenTelemetry ──
  # Record every trace unconditionally. Without this, the default parent-based
  # sampler follows the platform proxy's sampling decision and drops most spans,
  # leaving otel_spans near-empty. See:
  # https://docs.databricks.com/aws/en/dev-tools/databricks-apps/observability/
  - name: OTEL_TRACES_SAMPLER
    value: always_on
