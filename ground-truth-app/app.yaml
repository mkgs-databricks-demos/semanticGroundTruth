# Run node directly (same as `pnpm run start`) so SIGTERM from the platform reaches
# the server process and its graceful shutdown handler (server/lib/shutdown.ts),
# instead of going through a pnpm wrapper that prints `[ELIFECYCLE] Command failed`.
command: ['node', '--env-file-if-exists=./.env', './dist/server.js']
env:
  - name: NODE_ENV
    value: production

  # ── App resource bindings (injected by platform from databricks.yml resources) ──
  - name: DATABRICKS_SERVING_ENDPOINT_NAME
    valueFrom: agents-serving-endpoint
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: agents-mlflow-experiment
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DATABRICKS_JOB_ID
    valueFrom: job
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres

  # ── RBAC bootstrap ──
  # M2M SPN client_id from the m2m-client-id secret resource (resources/app.app.yml).
  # The resource must be attached via `bundle deploy` before any plain `apps deploy`.
  - name: GT_BOOTSTRAP_ADMIN_IDS
    valueFrom: m2m-client-id
  - name: GT_ADMIN_EMAILS
    value: matthew.giglia@databricks.com

  # ── OpenTelemetry ──
  # Record every trace unconditionally. Without this, the default parent-based
  # sampler follows the platform proxy's sampling decision and drops most spans,
  # leaving otel_spans near-empty. See:
  # https://docs.databricks.com/aws/en/dev-tools/databricks-apps/observability/
  - name: OTEL_TRACES_SAMPLER
    value: always_on
