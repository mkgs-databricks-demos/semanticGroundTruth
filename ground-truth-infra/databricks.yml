# Declarative Automation Bundle configuration — ground-truth-infra
# Deploy order: this bundle (Bundle 1) deploys FIRST. Bundles 2 and 3 deploy after.
# Design sources: L100 §Deployment Architecture, L200-C1, L200-C6, L200-C9, L300-01 through L300-08
bundle:
  name: "ground-truth-infra"

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog:
    description: "Target Unity Catalog catalog name"
    default: hls_fde_dev
  schema:
    description: "Target Unity Catalog schema name"
    default: semantic_ground_truth
  notification_slack_webhook:
    description: "Slack incoming webhook URL for job alert notifications"
    default: ""
  notification_teams_webhook:
    description: "Microsoft Teams incoming webhook URL for job alert notifications"
    default: ""

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
      root_path: /Users/matthew.giglia@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hls_fde_dev
      # DAB dev mode prepends dev_<user>_ to schema names.
      # Using 'semantic_ground_truth' here → actual UC schema: dev_matthew_giglia_semantic_ground_truth
      schema: semantic_ground_truth

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://fevm-hls-fde.cloud.databricks.com
      root_path: /Users/matthew.giglia@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as matthew.giglia@databricks.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: matthew.giglia@databricks.com
    variables:
      catalog: prod_ground_truth
      schema: app
