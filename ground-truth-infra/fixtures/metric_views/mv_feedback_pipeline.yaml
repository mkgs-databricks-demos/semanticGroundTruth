# Metric View Fixture: mv_feedback_pipeline
# Design source: L200-C9, L300-05
# Source: bronze_lakebase_cdf (feedback_batches)
# Measures: Total Batches, Success Rate, Avg Processing Time

name: mv_feedback_pipeline

sql: |
  CREATE OR REPLACE VIEW ${catalog}.${schema}.mv_feedback_pipeline
  WITH METRICS
  LANGUAGE YAML
  AS $$
    version: 1.1
    source: >
      SELECT
        data:id::STRING AS id,
        data:status::STRING AS status,
        data:asset_count::INT AS asset_count,
        data:processing_time_seconds::DOUBLE AS processing_time_seconds,
        data:triggered_by::STRING AS triggered_by,
        data:branch_name::STRING AS branch_name,
        data:created_at::TIMESTAMP AS created_at,
        data:completed_at::TIMESTAMP AS completed_at,
        DATE_TRUNC('DAY', data:created_at::TIMESTAMP) AS batch_date,
        DATE_TRUNC('WEEK', data:created_at::TIMESTAMP) AS batch_week,
        CASE WHEN data:status::STRING = 'completed' THEN 1 ELSE 0 END AS is_success,
        CASE WHEN data:status::STRING = 'failed' THEN 1 ELSE 0 END AS is_failed
      FROM (
        SELECT *
        FROM ${catalog}.${schema}.bronze_lakebase_cdf
        WHERE _source_table = 'feedback_batches'
          AND _pg_change_type <> 'update_preimage'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY _record_key ORDER BY _sort_by DESC) = 1
      ) WHERE _pg_change_type <> 'delete'
    comment: Operational metrics for the feedback pipeline job runs.
    dimensions:
      - name: status
        expr: status
        display_name: Batch Status
        comment: Pipeline run status (pending, completed, failed)
        synonyms:
          - batch status
          - run status
          - pipeline status
      - name: triggered_by
        expr: triggered_by
        display_name: Triggered By
        comment: What initiated the batch (user, scheduler, etc.)
      - name: batch_date
        expr: batch_date
        display_name: Batch Date
        format:
          type: date
          date_format: year_month_day
      - name: batch_week
        expr: batch_week
        display_name: Batch Week
        format:
          type: date
          date_format: year_month_day
    measures:
      - name: Total Batches
        expr: COUNT(id)
        display_name: Total Batches
        comment: Number of feedback pipeline runs
        synonyms:
          - batches
          - pipeline runs
          - runs
      - name: Success Rate
        expr: SUM(is_success) / NULLIF(COUNT(id), 0)
        display_name: Success Rate
        comment: Fraction of pipeline runs that completed (0.0 to 1.0)
        format:
          type: percentage
          decimal_places:
            type: exact
            places: 1
        synonyms:
          - pass rate
          - successful runs
      - name: Failed Batches
        expr: SUM(is_failed)
        display_name: Failed Batches
        comment: Number of failed pipeline runs
        synonyms:
          - failures
          - failed runs
      - name: Avg Processing Time
        expr: AVG(processing_time_seconds)
        display_name: Avg Processing Time (sec)
        comment: Average time in seconds to complete a feedback pipeline run
        format:
          type: number
          decimal_places:
            type: exact
            places: 1
        synonyms:
          - processing time
          - duration
          - average duration
      - name: Total Assets Processed
        expr: SUM(asset_count)
        display_name: Total Assets Processed
        comment: Total number of assets processed across all batches
        synonyms:
          - assets processed
          - total processed
  $$
