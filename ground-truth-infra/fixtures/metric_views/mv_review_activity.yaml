# Metric View Fixture: mv_review_activity
# Design source: L200-C9, L300-05
# Source: bronze_lakebase_cdf (_source_table IN ('votes', 'review_skips'))
#   votes        -> app.votes, latest CDF row per vote (id set, skip_id NULL)
#   review_skips -> app.review_skips, latest CDF row per skip (migration 009; skip_id set, id NULL).
#                   A skip is NOT a vote: vote measures count id, skip measures count skip_id.
#   Latest row per _record_key (same pattern as the other CDF views): Lakehouse Sync resnapshots
#   (e.g. after a migration ALTERs a table) and updates re-emit rows that must not count twice.
# Measures: Total Votes, Unique Reviewers, Approval Rate, Reject Count, Edit Count, skips, skip_rate

name: mv_review_activity

sql: |
  CREATE OR REPLACE VIEW ${catalog}.${schema}.mv_review_activity
  WITH METRICS
  LANGUAGE YAML
  AS $$
    version: 1.1
    source: >
      SELECT
        data:id::STRING AS id,
        data:asset_id::STRING AS asset_id,
        data:user_id::STRING AS user_id,
        data:vote_type::STRING AS vote_type,
        data:source::STRING AS vote_source,
        data:feedback::STRING AS feedback,
        data:campaign_id::STRING AS campaign_id,
        data:created_at::TIMESTAMP AS created_at,
        DATE_TRUNC('DAY', data:created_at::TIMESTAMP) AS vote_date,
        DATE_TRUNC('WEEK', data:created_at::TIMESTAMP) AS vote_week,
        DATE_TRUNC('MONTH', data:created_at::TIMESTAMP) AS vote_month,
        CAST(NULL AS STRING) AS skip_id,
        CAST(NULL AS STRING) AS skip_reason
      FROM (
        SELECT data, _pg_change_type
        FROM ${catalog}.${schema}.bronze_lakebase_cdf
        WHERE _source_table = 'votes'
          AND _pg_change_type <> 'update_preimage'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY _record_key ORDER BY _sort_by DESC) = 1
      ) WHERE _pg_change_type <> 'delete'
      UNION ALL
      SELECT
        CAST(NULL AS STRING) AS id,
        data:asset_id::STRING AS asset_id,
        data:user_id::STRING AS user_id,
        CAST(NULL AS STRING) AS vote_type,
        data:source::STRING AS vote_source,
        CAST(NULL AS STRING) AS feedback,
        data:campaign_id::STRING AS campaign_id,
        data:created_at::TIMESTAMP AS created_at,
        DATE_TRUNC('DAY', data:created_at::TIMESTAMP) AS vote_date,
        DATE_TRUNC('WEEK', data:created_at::TIMESTAMP) AS vote_week,
        DATE_TRUNC('MONTH', data:created_at::TIMESTAMP) AS vote_month,
        data:id::STRING AS skip_id,
        data:reason::STRING AS skip_reason
      FROM (
        SELECT data, _pg_change_type
        FROM ${catalog}.${schema}.bronze_lakebase_cdf
        WHERE _source_table = 'review_skips'
          AND _pg_change_type <> 'update_preimage'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY _record_key ORDER BY _sort_by DESC) = 1
      ) WHERE _pg_change_type <> 'delete'
    comment: Review activity metrics over the semantic ground truth vote history.
    dimensions:
      - name: asset_id
        expr: asset_id
        display_name: Asset ID
        comment: Unique identifier of the reviewed asset
      - name: vote_type
        expr: vote_type
        display_name: Vote Type
        comment: approve, reject, or edit
        synonyms:
          - vote
          - decision
          - review outcome
      - name: user_id
        expr: user_id
        display_name: Reviewer
        comment: Email or SPN id of the reviewer
        synonyms:
          - reviewer
          - reviewer id
      - name: vote_source
        expr: vote_source
        display_name: Vote Source
        comment: Channel the vote came from (web, mcp, agent)
        synonyms:
          - source
          - channel
      - name: campaign_id
        expr: campaign_id
        display_name: Campaign ID
        comment: Campaign that prompted the vote (nullable)
      - name: vote_date
        expr: vote_date
        display_name: Vote Date
        format:
          type: date
          date_format: year_month_day
      - name: vote_month
        expr: vote_month
        display_name: Vote Month
        format:
          type: date
          date_format: locale_long_month
      - name: skip_reason
        expr: skip_reason
        display_name: Skip Reason
        comment: Reason given for a skipped card (not_sure, not_my_area, need_context, other); null for votes and for skips without a reason
        synonyms:
          - reason skipped
          - skip cause
    measures:
      - name: Total Votes
        expr: COUNT(id)
        display_name: Total Votes
        comment: Total number of votes cast
        synonyms:
          - votes
          - reviews
          - total reviews
      - name: Unique Reviewers
        expr: COUNT(DISTINCT user_id) FILTER (WHERE id IS NOT NULL)
        display_name: Unique Reviewers
        synonyms:
          - reviewers
          - review participants
      - name: Approval Rate
        expr: SUM(CASE WHEN vote_type = 'approve' THEN 1 ELSE 0 END) / NULLIF(COUNT(id), 0)
        display_name: Approval Rate
        comment: Fraction of votes that were approvals (0.0 to 1.0)
        format:
          type: percentage
          decimal_places:
            type: exact
            places: 1
        synonyms:
          - approve rate
          - pass rate
      - name: Reject Count
        expr: SUM(CASE WHEN vote_type = 'reject' THEN 1 ELSE 0 END)
        display_name: Rejections
        comment: Number of rejection votes
      - name: Edit Count
        expr: SUM(CASE WHEN vote_type = 'edit' THEN 1 ELSE 0 END)
        display_name: Edit Proposals
        comment: Number of edit proposal votes
      - name: skips
        expr: COUNT(DISTINCT skip_id)
        display_name: Skipped Cards
        comment: Number of skipped cards (app.review_skips inserts). Skips are not votes and are excluded from Total Votes and Approval Rate.
        synonyms:
          - skipped cards
          - skip count
          - skipped
      - name: skip_rate
        expr: COUNT(DISTINCT skip_id) / NULLIF(COUNT(id) + COUNT(DISTINCT skip_id), 0)
        display_name: Skip Rate
        comment: Skipped cards as a fraction of all review actions, skips / (votes + skips) (0.0 to 1.0; null when there is no activity)
        format:
          type: percentage
          decimal_places:
            type: exact
            places: 1
        synonyms:
          - skip percentage
          - skipped share
  $$
