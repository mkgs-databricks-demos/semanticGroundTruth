# Metric View Fixture: mv_user_leaderboard
# Design source: L200-C9, L300-05
# Source: bronze_lakebase_cdf (_source_table = 'user_activity', latest row per user;
#   total_skips added to app.user_activity by migration 009 — null on older rows, counted as 0)
# Measures: Total Votes, Current Streak, Longest Streak, Active Reviewers, total_skips

name: mv_user_leaderboard

sql: |
  CREATE OR REPLACE VIEW ${catalog}.${schema}.mv_user_leaderboard
  WITH METRICS
  LANGUAGE YAML
  AS $$
    version: 1.1
    source: >
      SELECT
        data:user_id::STRING AS user_id,
        data:email::STRING AS email,
        data:total_votes::INT AS total_votes,
        COALESCE(data:total_skips::INT, 0) AS total_skips,
        data:current_streak_days::INT AS current_streak_days,
        data:longest_streak_days::INT AS longest_streak_days,
        data:last_vote_date::DATE AS last_vote_date,
        data:updated_at::TIMESTAMP AS updated_at,
        DATE_TRUNC('MONTH', data:updated_at::TIMESTAMP) AS active_month
      FROM (
        SELECT *
        FROM ${catalog}.${schema}.bronze_lakebase_cdf
        WHERE _source_table = 'user_activity'
          AND _pg_change_type <> 'update_preimage'
        QUALIFY ROW_NUMBER() OVER (PARTITION BY _record_key ORDER BY _sort_by DESC) = 1
      ) WHERE _pg_change_type <> 'delete'
    comment: User leaderboard metrics showing reviewer engagement and contributions.
    dimensions:
      - name: user_id
        expr: user_id
        display_name: User ID
        comment: Primary identifier of the reviewer
      - name: email
        expr: email
        display_name: Email
        comment: Email address of the reviewer
        synonyms:
          - name
          - user
          - reviewer
      - name: active_month
        expr: active_month
        display_name: Active Month
        format:
          type: date
          date_format: locale_long_month
    measures:
      - name: Total Votes
        expr: SUM(total_votes)
        display_name: Total Votes
        comment: Aggregate votes across reviewers
        synonyms:
          - reviews
          - review count
          - contributions
      - name: Current Streak
        expr: MAX(current_streak_days)
        display_name: Max Current Streak
        comment: Longest active consecutive-day streak among reviewers
        synonyms:
          - streak
          - active streak
      - name: Longest Streak
        expr: MAX(longest_streak_days)
        display_name: Max All-Time Streak
        comment: Longest all-time consecutive-day streak among reviewers
        synonyms:
          - record streak
          - best streak
      - name: Active Reviewers
        expr: COUNT(DISTINCT user_id)
        display_name: Active Reviewers
        comment: Number of distinct reviewers with activity
        synonyms:
          - users
          - participants
      - name: total_skips
        expr: SUM(total_skips)
        display_name: Total Skips
        comment: Aggregate skipped cards across reviewers (shown, never ranked on; skips are not votes)
        synonyms:
          - skips
          - skipped cards
  $$
