# resources/lakebase/app_role.postgres_role.yml
# Database owner role for ground_truth_app.
# Design source: L300-02
#
# identity_type intentionally omitted: plain Postgres role (not tied to a
# Databricks identity). AppKit CAN_CONNECT_AND_CREATE auto-provisions a
# separate Lakebase role (dbrx-apps-<uuid>) for the app SPN with OAuth auth.
# The app SPN creates its own schemas (app, appkit) on startup and never
# assumes this role. Keep this role as the database owner for declarative
# tracking; grant membership to non-AppKit consumers if needed later.

resources:
  postgres_roles:
    app_role:
      parent: "${resources.postgres_branches.production.name}"
      role_id: app-role
      postgres_role: ground_truth_app_role
      lifecycle:
        prevent_destroy: true
