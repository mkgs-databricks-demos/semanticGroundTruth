# resources/jobs/feedback_pipeline.job.yml
# Daily 11 PM: collect unprocessed votes → call Genie Code API → create feature branch
# Design source: L300-04, L300-05

resources:
  jobs:
    feedback_pipeline:
      name: "Semantic Ground Truth — Feedback Pipeline"
      description: "Collects reviewer votes, generates proposed YAML edits via Genie Code, and creates a Git feature branch."

      schedule:
        quartz_cron_expression: "0 0 23 * * ?"  # Daily 11 PM UTC
        timezone_id: UTC

      environments:
        - environment_key: serverless
          spec:
            client: "1"

      tasks:
        - task_key: collect_feedback
          description: "Query unprocessed votes, group by asset, write feedback staging table"
          notebook_task:
            notebook_path: ../../src/notebooks/collect_feedback.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${resources.schemas.ground_truth_schema.name}"
              cutoff_hours: "24"
          environment_key: serverless

        - task_key: create_feature_branch
          description: "Call Genie Code API, generate proposed YAML edits, create Git feature branch"
          depends_on:
            - task_key: collect_feedback
          notebook_task:
            notebook_path: ../../src/notebooks/create_feature_branch.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${resources.schemas.ground_truth_schema.name}"
              genie_space_id: ""  # set after Genie skill registration
              git_folder_id: ""   # set to Repos folder ID for YAML fixtures
          environment_key: serverless

      email_notifications:
        on_failure:
          - matthew.giglia@databricks.com
