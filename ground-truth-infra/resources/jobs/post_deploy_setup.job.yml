# resources/jobs/post_deploy_setup.job.yml
# Post-deploy setup: automates manual steps that can't be DAB-declared.
# Triggered by the run_post_deploy job_run resource (config changes only) and by
# `./deploy.sh --target <t> --infra`, which always runs it with run_setup=true and waits
# (build 5, session 46): a bundle deploy resets feedback_pipeline.author_feedback_branch to
# its notebook placeholder, and setup_job_params turns it back into a genie_task.
# Design source: docs/plans/post_deploy_automation_plan.md
#
# Gate: check_run_setup condition_task — skips all tasks when run_setup=false
# Group A (unblocked): secrets, M2M SPN (+ Genie One MCP smoke test), Genie Code automation, feedback_pipeline job params
# Group B (post-Bundle 2): Lakebase CDF
# (G10, 2026-10-24: the scaffold-only setup_gateway_connection / setup_app_role_sp tasks and the
#  check_m2m_secret_present gate that fed only setup_gateway_connection were removed.)
#
# Secret scope is declarative; key values populated by setup_secrets task.
# MCP Service is declarative.

resources:
  jobs:
    post_deploy_setup:
      name: "Semantic Ground Truth — Post-Deploy Setup"
      description: "Automates post-deploy steps: secret key provisioning, M2M SPN, Genie Code automation, job param wiring, CDF config."

      parameters:
        - name: run_setup
          default: "${var.run_setup}"
        - name: app_url
          default: ""
        - name: app_sp_client_id
          default: ""
        # Target name passed to the notebooks that need it (default: this bundle's target).
        - name: bundle_target
          default: "${bundle.target}"
        # setup_genie_automation: the author_feedback_branch configuration_id read by deploy.sh just
        # before the infra deploy reset the task (reused, so the first run does not create a new one).
        - name: previous_configuration_id
          default: ""
        # setup_genie_automation: delete other feedback-author automations (one per target).
        - name: cleanup_duplicates
          default: "true"
        # setup_genie_automation: extra automation ids to delete once (comma-separated).
        - name: duplicate_automation_ids
          default: ""
        - name: m2m_client_id_dbs_key
          default: "${var.m2m_client_id_dbs_key}"
        - name: m2m_client_secret_dbs_key
          default: "${var.m2m_client_secret_dbs_key}"
        - name: m2m_oauth_scopes
          default: "${var.m2m_oauth_scopes}"

      # One run at a time; a run started while another is active (e.g. the run_post_deploy job_run
      # and deploy.sh's run_post_deploy_setup) waits in the queue instead of being skipped.
      max_concurrent_runs: 1
      queue:
        enabled: true

      environments:
        - environment_key: serverless
          spec:
            client: "1"

      tasks:
        # --- Gate: Should setup run? (false in dev by default, override with --var run_setup=true) ---
        - task_key: check_run_setup
          description: "Skip all setup tasks when run_setup=false (routine dev deploys)"
          condition_task:
            left: "{{job.parameters.run_setup}}"
            op: EQUAL_TO
            right: "true"

        # --- Group A: Unblocked (auto-triggered by job_run on every deploy) ---

        - task_key: ensure_m2m_service_principal
          description: "Find or create the bundle-owned OAuth M2M SPN; store client_id; verify secret if present"
          depends_on:
            - task_key: check_run_setup
              outcome: "true"
          notebook_task:
            notebook_path: ../../src/notebooks/ensure_m2m_service_principal.py
            base_parameters:
              bundle_target: "{{job.parameters.bundle_target}}"
              secret_scope_name: "${resources.secret_scopes.ground_truth_secret_scope.name}"
              m2m_spn_prefix: "${var.m2m_spn_prefix}"
              m2m_client_id_dbs_key: "{{job.parameters.m2m_client_id_dbs_key}}"
              m2m_client_secret_dbs_key: "{{job.parameters.m2m_client_secret_dbs_key}}"
              workspace_url: "${workspace.host}"
              m2m_oauth_scopes: "{{job.parameters.m2m_oauth_scopes}}"
          environment_key: serverless

        # Gate: only smoke-test the gateway once the M2M token exchange is verified
        - task_key: check_m2m_token_verified
          description: "Skip MCP smoke tests until the M2M SPN secret is provisioned and verified"
          depends_on:
            - task_key: ensure_m2m_service_principal
          condition_task:
            left: "{{tasks.ensure_m2m_service_principal.values.m2m_token_verified}}"
            op: EQUAL_TO
            right: "true"

        - task_key: smoke_test_genie_one_mcp
          description: "M2M SPN → Unity Gateway → Genie One MCP (system.ai.genie_one_mcp): initialize + tools/list"
          depends_on:
            - task_key: check_m2m_token_verified
              outcome: "true"
          notebook_task:
            notebook_path: ../../src/notebooks/smoke_test_genie_one_mcp.py
            base_parameters:
              secret_scope_name: "${resources.secret_scopes.ground_truth_secret_scope.name}"
              m2m_client_id_dbs_key: "{{job.parameters.m2m_client_id_dbs_key}}"
              m2m_client_secret_dbs_key: "{{job.parameters.m2m_client_secret_dbs_key}}"
              workspace_url: "${workspace.host}"
              mcp_service_name: "system.ai.genie_one_mcp"
              oauth_scope: "ai-gateway"
          environment_key: serverless

        - task_key: setup_secrets
          description: "Write workspace_url to the secret scope and report missing keys (JSON exit value, read by deploy.sh)"
          # Runs after ensure_m2m_service_principal so the M2M client_id is already written
          depends_on:
            - task_key: ensure_m2m_service_principal
          notebook_task:
            notebook_path: ../../src/notebooks/setup_secrets.py
            base_parameters:
              secret_scope: "${resources.secret_scopes.ground_truth_secret_scope.name}"
              workspace_url: "${workspace.host}"
              m2m_client_id_dbs_key: "{{job.parameters.m2m_client_id_dbs_key}}"
              m2m_client_secret_dbs_key: "{{job.parameters.m2m_client_secret_dbs_key}}"
              admin_keys: "slack_webhook_url,teams_webhook_url"
          environment_key: serverless

        - task_key: setup_genie_automation
          description: "Reuse and update the one Genie Code automation for the feedback pipeline (create only if none exists); delete duplicates"
          depends_on:
            - task_key: check_run_setup
              outcome: "true"
          notebook_task:
            notebook_path: ../../src/notebooks/setup_genie_automation.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${resources.schemas.ground_truth_schema.name}"
              git_folder_id: "4271072627166222"
              bundle_target: "{{job.parameters.bundle_target}}"
              feedback_job_id: "${resources.jobs.feedback_pipeline.id}"
              previous_configuration_id: "{{job.parameters.previous_configuration_id}}"
              cleanup_duplicates: "{{job.parameters.cleanup_duplicates}}"
              duplicate_ids: "{{job.parameters.duplicate_automation_ids}}"
          environment_key: serverless

        - task_key: setup_job_params
          description: "Patch feedback_pipeline job with genie_task configuration_id from setup_genie_automation"
          depends_on:
            - task_key: setup_genie_automation
          notebook_task:
            notebook_path: ../../src/notebooks/setup_job_params.py
            base_parameters:
              feedback_job_id: "${resources.jobs.feedback_pipeline.id}"
              catalog: "${var.catalog}"
              schema: "${resources.schemas.ground_truth_schema.name}"
          environment_key: serverless

        # --- Gate: Bundle 2 ready? (Group B skipped when app_url empty or run_setup=false) ---
        - task_key: check_bundle2_ready
          description: "Check if Bundle 2 has deployed and provided an app URL"
          depends_on:
            - task_key: check_run_setup
              outcome: "true"
          condition_task:
            left: "{{job.parameters.app_url}}"
            op: NOT_EQUAL
            right: ""

        # --- Group B: Post-Bundle 2 ---

        - task_key: setup_cdf_config
          description: "Configure Lakebase Lakehouse Sync (CDF replication to Delta)"
          depends_on:
            - task_key: check_bundle2_ready
              outcome: "true"
          notebook_task:
            notebook_path: ../../src/notebooks/setup_cdf_config.py
            # Keys must equal the notebook's widget names (database, source_schema, catalog, schema),
            # the same as setup_lakebase_cdf.job.yml. The old lakebase_branch_id key matched no widget,
            # so `database` stayed empty.
            base_parameters:
              database: "${resources.postgres_databases.app_db.id}"
              source_schema: "app"
              catalog: "${var.catalog}"
              schema: "${resources.schemas.ground_truth_schema.name}"
          environment_key: serverless

      email_notifications:
        on_failure:
          - matthew.giglia@databricks.com
