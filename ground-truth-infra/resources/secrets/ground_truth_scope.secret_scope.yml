# resources/secrets/ground_truth_scope.secret_scope.yml
# Workspace secret scope for Ground Truth app runtime configuration.
# Design source: docs/plans/post_deploy_automation_plan.md, lakeLoom pattern
#
# The scope holds secrets the Bundle 2 app reads at container start
# via app.resources.secret + app.yaml valueFrom bindings.
# Individual key-values are populated by post_deploy_setup tasks or manually.
#
# Keys planned:
#
# AUTO-PROVISIONED by post_deploy_setup job:
#   workspace_url                  — Databricks workspace URL (setup_secrets task)
#   m2m_client_id_<schema>         — M2M SPN application_id (ensure_m2m_service_principal task)
#
# ADMIN-PROVISIONED (manual or via deploy.sh):
#   slack_webhook_url              — Slack incoming webhook URL for C7 Notification Service
#   teams_webhook_url              — Teams incoming webhook URL for C7 Notification Service
#   m2m_client_secret_<schema>     — M2M SPN OAuth secret (see docs/runbooks/m2m-service-principal.md)
#
# To populate a key:
#   databricks secrets put-secret semantic_ground_truth_credentials <key> --string-value "<value>"
#
# NOTE: The app SPN's READ permission on this scope is granted by
# a configure_app_spn job in Bundle 2 (following the lakeLoom pattern),
# not declared here. Only admin/deploy permissions are declared below.
#
# Requires: engine: direct, CLI ≥ 0.252.0

resources:
  secret_scopes:
    ground_truth_secret_scope:
      name: ${var.secret_scope_name}

      # Databricks-managed backend (not external keystore backed)
      backend_type: DATABRICKS

      # Prevent accidental deletion of the secret scope
      lifecycle:
        prevent_destroy: true

# ---------------------------------------------------------------------------
# Target-specific permissions
# (App SPN READ is handled by Bundle 2's configure_app_spn job)
# ---------------------------------------------------------------------------
targets:

  dev:
    resources:
      secret_scopes:
        ground_truth_secret_scope:
          name: ${var.secret_scope_name}
          permissions:
            - user_name: matthew.giglia@databricks.com
              level: MANAGE

  prod:
    resources:
      secret_scopes:
        ground_truth_secret_scope:
          name: ${var.secret_scope_name}
          permissions:
            - user_name: matthew.giglia@databricks.com
              level: MANAGE
